name: Check links

on:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"  # Mondays 06:00 UTC
  workflow_dispatch:

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          # x.com, Medium and the Google Cloud console block anonymous checkers
          args: >-
            --no-progress --max-retries 2 --accept 200,206,429
            --exclude '^https://x\.com/' --exclude '^https://medium\.com/' --exclude '^https://console\.cloud\.google\.com/'
            README.md README.zh-CN.md DATA_QUALITY.md CONTRIBUTING.md AGENTS.md docs/*.md
          fail: true
