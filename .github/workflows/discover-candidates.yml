# Searches GitHub every day for repos that may belong in the list and keeps
# one open issue with the candidates. Nothing is added to the list
# automatically: a maintainer checks each source and labels it by hand.
name: Discover candidates

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Search GitHub and update the candidates issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          since=$(date -u -d '14 days ago' +%Y-%m-%d)
          queries=(
            'hackertube'
            'hackerbooks'
            '"hacker news" dataset'
            '"hacker news" duckdb'
            '"hacker news" parquet'
            'hackernews comments analysis'
            'open-index hacker-news'
          )

          # Repos already linked anywhere in the list.
          cat README*.md docs/*.md \
            | grep -oiE 'github\.com/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+' \
            | sed -E 's#^github\.com/##I; s#\.git$##' | tr 'A-Z' 'a-z' | sort -u > known.txt
          echo "${GITHUB_REPOSITORY,,}" >> known.txt
          # Repos a maintainer already reviewed and left out.
          grep -vE '^\s*(#|$)' .github/discover-skip.txt | awk '{ print tolower($1) }' >> known.txt

          : > found.tsv
          for q in "${queries[@]}"; do
            gh search repos "$q" --updated ">=$since" --limit 50 \
              --json fullName,description,stargazersCount,url,isFork \
              --jq '.[] | select(.isFork | not)
                    | [.fullName, (.stargazersCount | tostring), .url,
                       ((.description // "") | gsub("[\t\r\n|]"; " ") | .[0:140])]
                    | @tsv' >> found.tsv || echo "search failed: $q"
            sleep 3
          done

          # Repos whose code reads the open-index archive, whatever their description says.
          gh search code '"open-index/hacker-news"' --limit 50 --json repository \
            --jq '.[].repository.nameWithOwner' 2>/dev/null | sort -u | while read -r repo; do
              gh repo view "$repo" --json nameWithOwner,stargazerCount,url,description,isFork \
                --jq 'select(.isFork | not) | [.nameWithOwner, (.stargazerCount | tostring), .url,
                       ((.description // "") | gsub("[\t\r\n|]"; " ") | .[0:140])] | @tsv' \
                >> found.tsv || true
            done || echo "code search failed"

          sort -u -t$'\t' -k1,1 found.tsv \
            | awk -F'\t' 'NR==FNR { known[$1]; next } !(tolower($1) in known)' known.txt - \
            | awk -F'\t' '
                # Keep a repo only if its name or description is about HN data.
                # "hacker" alone also matches CTF and security repos.
                {
                  d = tolower($1 " " $4)
                  hn = d ~ /hacker ?news|hackernews|(^|[^a-z])hn([^a-z]|$)|ycombinator/
                  wave = d ~ /hackertube|hackerbooks|hacker(blogs|pods|shelf|papers)/
                  ctf = d ~ /writeup|ctf|exploit|pentest/
                }
                (hn || wave) && !ctf { print }
              ' \
            | sort -t$'\t' -k2,2nr | head -n 60 > candidates.tsv

          {
            echo "> This is the maintainer's review queue, not part of the list. To suggest a project, use the [project form](https://github.com/${GITHUB_REPOSITORY}/issues/new?template=project.yml)."
            echo
            echo "Repos updated since $since that match HN data searches and are not in the list yet."
            echo
            echo "Generated by \`.github/workflows/discover-candidates.yml\` on $(date -u +%Y-%m-%d). Check each source before adding it, and label it by what the source says. Many results will be unrelated."
            echo
            if [ -s candidates.tsv ]; then
              echo "| Repo | Stars | Description |"
              echo "|---|---:|---|"
              awk -F'\t' '{ printf "| [%s](%s) | %s | %s |\n", $1, $3, $2, $4 }' candidates.tsv
            else
              echo "No new candidates this time."
            fi
          } > body.md

          title="Maintainer queue: auto-found candidates (not yet reviewed)"
          number=$(gh issue list --state open --limit 100 --json number,title \
            --jq "map(select(.title == \"$title\")) | .[0].number // empty")
          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file body.md
          else
            gh issue create --title "$title" --body-file body.md
          fi
          echo "$(wc -l < candidates.tsv) candidates"
